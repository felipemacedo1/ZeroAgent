[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroagent"
version = "0.1.0"
description = "Budget-bounded, event-driven software execution with deterministic evidence"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
zeroagent = "zeroagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
