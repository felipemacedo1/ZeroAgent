name: Issue experiment (mock, zero inference cost)
on:
  pull_request:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number associated with this bundled version experiment
        required: true
        type: number
permissions:
  contents: read
  issues: read
concurrency:
  group: zeroagent-experiment
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read issue as data (never interpolate issue text into shell)
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue || '7' }}
        run: gh issue view "$ISSUE_NUMBER" --json number,title,body > issue.json
      - run: docker pull python:3.12-slim
      - run: PYTHONPATH=src python3 -m zeroagent.cli demo --sandbox docker --issue-json issue.json --root workspace/issue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-experiment
          path: |
            workspace/issue/artifacts/
            issue.json
          retention-days: 1
